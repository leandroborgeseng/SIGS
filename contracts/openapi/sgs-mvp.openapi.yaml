              type: string
              description: Nome social se houver, senão civil (espelha PostLoad do e-SUS)
        - $ref: '#/components/schemas/ProfessionalWrite'

    ProfessionalPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Professional'
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }

    ProfessionalAllocationWrite:
      type: object
      required: [facilityId, cboId]
