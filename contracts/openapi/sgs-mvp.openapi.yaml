        type: { type: string, enum: [user, technical] }
        version: { type: string }

    HelpArticle:
      allOf:
        - $ref: '#/components/schemas/HelpArticleSummary'
        - type: object
          properties:
            bodyMarkdown: { type: string }
            updatedAt: { type: string, format: date-time }
            versions:
              type: array
              items: { type: string }

    FacilityWrite:
      type: object
