        typeId: { type: string, description: TipoUnidadeSaude }
        subtypeId: { type: string, description: SubtipoUnidadeSaude }
        active: { type: boolean }
        phone1: { type: string }
        phone2: { type: string }
        fax: { type: string }
        email: { type: string, format: email }
        address:
          $ref: '#/components/schemas/Address'

    Facility:
      allOf:
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
        - $ref: '#/components/schemas/FacilityWrite'

    FacilityPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Facility'
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }

    ProfessionalWrite:
      type: object
      required: [civilName]
      properties:
        cpf: { type: string, maxLength: 11 }
        cns: { type: string, maxLength: 16 }
