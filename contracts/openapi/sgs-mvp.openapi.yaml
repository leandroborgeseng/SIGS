        active: { type: boolean, default: true }
        deactivatedAt: { type: string, format: date-time }

    ProfessionalAllocation:
      allOf:
        - type: object
          required: [id, professionalId]
          properties:
            id: { type: string, format: uuid }
            professionalId: { type: string, format: uuid }
            facilityCnes: { type: string }
            teamIne: { type: string }
            cboCode2002: { type: string }
        - $ref: '#/components/schemas/ProfessionalAllocationWrite'

    TeamWrite:
      type: object
