services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sigs
      POSTGRES_PASSWORD: sigs
      POSTGRES_DB: sigs
    ports:
      - "5432:5432"
    volumes:
      - sigs-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigs -d sigs"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - sigs-minio:/data

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      PROCESS_ROLE: api
      PORT: "3001"
      DATABASE_URL: postgresql://sigs:sigs@postgres:5432/sigs?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: sigs
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      S3_FORCE_PATH_STYLE: "true"
      S3_REGION: us-east-1
      JWT_SECRET: ${JWT_SECRET:-dev-change-me}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@sigs.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123}
      LEDI_AUTOFIX_ASYNC_THRESHOLD: "40"
    ports:
      - "3001:3001"
    restart: unless-stopped

  worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      api:
        condition: service_started
    environment:
      PROCESS_ROLE: worker
      DATABASE_URL: postgresql://sigs:sigs@postgres:5432/sigs?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: sigs
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      S3_FORCE_PATH_STYLE: "true"
      S3_REGION: us-east-1
      WORKER_CONCURRENCY: "2"
      JWT_SECRET: ${JWT_SECRET:-dev-change-me}
    restart: unless-stopped

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
    depends_on:
      - api
    environment:
      PROCESS_ROLE: web
      PORT: "3000"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  sigs-pg:
  sigs-minio:
